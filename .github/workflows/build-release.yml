name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.1.66)"
        required: false
        type: string

concurrency: build-release-${{ github.ref }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            platform: darwin-arm64
            build-args: --single
            cross-compile: false
          - host: macos-latest
            platform: darwin-x64
            build-args: ""
            cross-compile: true
          - host: ubuntu-24.04
            platform: linux-x64
            build-args: --single
            cross-compile: false
          - host: ubuntu-24.04-arm
            platform: linux-arm64
            build-args: --single
            cross-compile: false
          - host: windows-latest
            platform: windows-x64
            build-args: --single
            cross-compile: false
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        shell: bash
        run: |
          bun install
          mkdir -p packages/opencode/node_modules/@opentui
          for pkg in solid core; do
            if [ ! -e packages/opencode/node_modules/@opentui/$pkg ]; then
              ln -s "$(pwd)/node_modules/@opentui/$pkg" packages/opencode/node_modules/@opentui/$pkg
              echo "Linked @opentui/$pkg"
            fi
          done

      - name: Read version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Build
        working-directory: packages/opencode
        run: bun run script/build.ts -- ${{ matrix.build-args }}
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}

      # 交叉编译时跳过 smoke test（产出的二进制无法在当前 host 执行）
      - name: Smoke test
        if: runner.os != 'Windows' && matrix.cross-compile == false
        shell: bash
        run: |
          cd packages/opencode
          BINARY=$(find dist -name "nuwaxcode" -o -name "nuwaxcode.exe" | head -1)
          echo "Binary: $BINARY"
          chmod +x "$BINARY" 2>/dev/null || true
          "$BINARY" --version

      - name: Create archive (tar.gz, non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd packages/opencode
          # 交叉编译时按 platform 过滤 dist 目录
          if [ "${{ matrix.cross-compile }}" = "true" ]; then
            DIST_DIR=$(find dist -mindepth 1 -maxdepth 1 -type d -name "*${{ matrix.platform }}*" | head -1)
          else
            DIST_DIR=$(find dist -mindepth 1 -maxdepth 1 -type d | head -1)
          fi
          if [ -z "$DIST_DIR" ]; then
            echo "ERROR: No dist directory found for platform ${{ matrix.platform }}"
            ls -la dist/
            exit 1
          fi
          NAME=$(basename "$DIST_DIR")
          cd "$DIST_DIR/bin"
          tar czf "${{ github.workspace }}/${NAME}.tar.gz" .
          echo "Created $NAME.tar.gz ($(ls -lh ${{ github.workspace }}/$NAME.tar.gz | awk '{print $5}'))"

      - name: Create archive (zip, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location packages/opencode
          $distDir = Get-ChildItem -Path dist -Directory | Select-Object -First 1
          $name = $distDir.Name
          Compress-Archive -Path "$($distDir.FullName)/bin/*" -DestinationPath "${{ github.workspace }}/$name.zip"
          Write-Host "Created $name.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          retention-days: 1
          path: |
            ${{ github.workspace }}/*.tar.gz
            ${{ github.workspace }}/*.zip

  release:
    needs: build
    if: always() && needs.build.result != 'failed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Create/update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          if gh release view "$TAG" 2>/dev/null; then
            echo "Release $TAG already exists, updating assets..."
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" --title "$TAG" --notes "nuwaxcode $TAG"
          fi

          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) | while read file; do
            echo "Uploading: $file"
            gh release upload "$TAG" "$file" --clobber
          done

          echo "=== Release $TAG assets ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'
