name: build-release

on:
  push:
    branches:
      - feat/nuwaxcode-nuwaclaw-builtin
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.1.65)"
        required: false
        type: string

concurrency: build-release-${{ github.ref }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            platform: darwin-arm64
          - host: macos-13
            platform: darwin-x64
          - host: ubuntu-24.04
            platform: linux-x64
          - host: ubuntu-24.04-arm
            platform: linux-arm64
          - host: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          bun install
          # Ensure @opentui/solid is linked in packages/opencode/node_modules
          # for the build script's relative import (../node_modules/@opentui/solid/...)
          mkdir -p packages/opencode/node_modules/@opentui
          if [ ! -e packages/opencode/node_modules/@opentui/solid ]; then
            ln -s "$(pwd)/node_modules/@opentui/solid" packages/opencode/node_modules/@opentui/solid
          fi

      - name: Read version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -e "console.log(require('./packages/opencode/package.json').version)")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Build (single platform)
        working-directory: packages/opencode
        run: bun run script/build.ts -- --single
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}

      - name: Smoke test (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd packages/opencode
          BINARY=$(find dist -name "nuwaxcode" -o -name "nuwaxcode.exe" | head -1)
          echo "Binary: $BINARY"
          chmod +x "$BINARY" 2>/dev/null || true
          "$BINARY" --version

      - name: Create archive (tar.gz, non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd packages/opencode
          DIST_DIR=$(find dist -mindepth 1 -maxdepth 1 -type d | head -1)
          NAME=$(basename "$DIST_DIR")
          cd "$DIST_DIR/bin"
          tar czf "${{ github.workspace }}/${NAME}.tar.gz" .
          echo "Created $NAME.tar.gz ($(ls -lh ${{ github.workspace }}/$NAME.tar.gz | awk '{print $5}'))"

      - name: Create archive (zip, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location packages/opencode
          $distDir = Get-ChildItem -Path dist -Directory | Select-Object -First 1
          $name = $distDir.Name
          Compress-Archive -Path "$($distDir.FullName)/bin/*" -DestinationPath "${{ github.workspace }}/$name.zip"
          Write-Host "Created $name.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          retention-days: 1
          path: |
            ${{ github.workspace }}/*.tar.gz
            ${{ github.workspace }}/*.zip

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Determine version
        id: version
        run: |
          echo "version=${{ inputs.version || '1.1.65' }}" >> $GITHUB_OUTPUT

      - name: Create/update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          if gh release view "$TAG" 2>/dev/null; then
            echo "Release $TAG already exists, updating assets..."
          else
            echo "Creating draft release $TAG..."
            gh release create "$TAG" --title "$TAG" --draft --notes "nuwaxcode $TAG"
          fi

          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) | while read -f file; do
            echo "Uploading: $file"
            gh release upload "$TAG" "$file" --clobber
          done

          echo "=== Release $TAG assets ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'
